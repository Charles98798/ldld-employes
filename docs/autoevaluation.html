<!doctype html><html lang="fr"><head><base target="_top"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#1D1D1B;font:14px/1.5 Inter,Helvetica,Arial,sans-serif}.sheet{max-width:1180px;margin:0 auto;background:#fff}header{padding:14px 22px 0}.haut{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.nom{font-size:20px;letter-spacing:.14em;text-transform:uppercase}.sous{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B4AB9B;margin-top:4px}.etape-info{border-left:1px solid #1D1D1B;padding-left:14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#B4AB9B;white-space:nowrap}.onglets{display:flex;margin-top:10px;border-bottom:1px solid #B4AB9B;overflow-x:auto;overflow-y:hidden}.onglets div{flex:1;min-width:92px;text-align:center;padding:4px 2px 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#B4AB9B}.onglets div i{display:block;font-style:normal;font-size:13px;letter-spacing:0}.onglets div.act{color:#1D1D1B;border-bottom:2px solid #1D1D1B;margin-bottom:-1px}.onglets div.act i,.onglets div.fait i{color:#1D1D1B}main{padding:6px 22px 0}h2{font-size:15px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;margin:18px 0 10px;line-height:1.3}.step{display:none}p{margin:8px 0;color:#555}.question{margin:0;padding:10px 0;border-bottom:1px solid #ece8e1}.qtitle{display:block;font-size:14px;margin-bottom:8px}.ratings{display:flex;gap:6px;flex-wrap:wrap}.ratings button{width:40px;min-height:34px;background:#fff;border:1px solid #B4AB9B;border-radius:0;font:13px Inter,Helvetica,Arial,sans-serif;color:#1D1D1B;cursor:pointer}.ratings button[aria-pressed=true]{background:#1D1D1B;color:#fff;border-color:#1D1D1B}.rating-text{color:#8D806A;font-size:12px;min-height:20px;margin-top:8px}.optional{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#B4AB9B}textarea{width:100%;resize:vertical;border:0;border-bottom:1px solid #B4AB9B;background:#f4f1ec;border-radius:0;padding:9px 10px;font:14px/1.5 Inter,Helvetica,Arial,sans-serif;min-height:60px;color:#1D1D1B}.obs{margin:6px 0 10px}details{margin:8px 0;color:#555}summary{cursor:pointer;font-size:11px;letter-spacing:.14em;text-transform:uppercase}.scale{list-style:none;padding:0;margin:10px 0;border-top:1px solid #ece8e1}.scale li{padding:8px 0;border-bottom:1px solid #ece8e1;font-size:13px}.actions{position:sticky;left:0;right:0;bottom:0;background:#fff;margin:18px 0 0;border-top:1px solid #ece8e1;padding:12px 0 16px;display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:100%}.primary{background:#1D1D1B;color:#fff;border:1px solid #1D1D1B;border-radius:0;padding:11px 26px;font:11px Inter,Helvetica,Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}.secondary{background:#fff;border:1px solid #1D1D1B;border-radius:0;color:#1D1D1B;font:11px Inter,Helvetica,Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:11px 22px}button:disabled{opacity:.55;cursor:wait}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #1D1D1B;outline-offset:2px}.status{font-size:12px;color:#555}.error{color:#a62f2f;font-size:13px}.notice{background:#f4f1ec;border-left:4px solid #CFCCC3;padding:8px 12px;margin:10px 0;font-size:13px}footer{display:none}.ry{margin:8px 0 14px}.ry-per{margin:0 0 6px;font-size:13px;font-weight:500;color:#1D1D1B}.ry-note{margin:0 0 14px;padding-left:10px;border-left:1px solid #B4AB9B;font-size:12px;color:#555}.ry .e,.ry .l{display:grid;grid-template-columns:minmax(150px,1.2fr) 100px 100px minmax(150px,2fr);gap:12px;align-items:center}.ry .e{padding:6px 0;border-bottom:1px solid #B4AB9B;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#B4AB9B}.ry .l{padding:12px 0;border-bottom:1px solid #ece8e1}.ry .v{font-size:15px}.ry .b{height:8px;background:#e8e3d9;position:relative}.ry .b i{display:block;height:100%;background:#1D1D1B}.ry .b u{position:absolute;top:-4px;bottom:-4px;width:2px;background:#3df267}.ry .t{display:inline-block;margin-top:6px;border:1px solid #1D1D1B;padding:1px 7px;font-size:12px}.ry .t.ok{background:#3df267;border-color:#3df267}@media(max-width:560px){.ry .e{display:none}.ry .l{grid-template-columns:1fr 1fr;gap:6px 12px}.ry .l>span:first-child{grid-column:1/-1;font-weight:500}.ry .l>div{grid-column:1/-1}.ry .v::before{content:attr(data-l);display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#B4AB9B}}hr{border:0;border-top:1px solid #ece8e1;margin:20px 0}[hidden]{display:none!important}.done{text-align:center;padding:24px 0}.done .mark{font-size:36px}.na{margin-top:8px;background:#fff;border:1px solid #B4AB9B;border-radius:0;color:#1D1D1B;padding:7px 12px;font:12px Inter,Helvetica,Arial,sans-serif;cursor:pointer}.na[aria-pressed=true]{background:#1D1D1B;color:#fff}@media(max-width:560px){header{padding:12px 16px 0}main{padding:6px 16px 0}.nom{font-size:16px}.sous{font-size:9px}.etape-info{display:none}.onglets{margin-top:8px}.onglets div{flex:0 0 46px;min-width:0;white-space:nowrap;font-size:0;padding:4px 0 6px}.onglets div i{font-size:13px}.onglets div.act{flex:1 0 auto;font-size:10px;padding:4px 10px 6px}.ratings button{width:calc(20% - 5px)}.actions{padding:10px 0 14px;justify-content:stretch}.actions button{flex:1 1 40%;padding:13px 8px}#save{flex-basis:100%;order:-1}.primary{letter-spacing:.12em}.secondary{letter-spacing:.12em}}@media print{.actions,details{display:none}section[hidden]{display:block!important}}</style><style>/* Style application */
body{background:#d0cdc5!important;font-family:Helvetica,Arial,sans-serif!important;font-weight:300!important;color:#111!important}
*{font-family:Helvetica,Arial,sans-serif!important;border-radius:0!important}
h1,h2{font-weight:300!important;text-transform:uppercase!important;letter-spacing:0!important;font-size:24px!important;color:#111!important}
button,.ratings button{background:transparent!important;border:1.5px solid #111!important;color:#111!important}
.ratings button[aria-pressed=true],#next{background:#111!important;color:#fff!important}
textarea{background:#e6e3dd!important;border:1.5px solid #111!important}
.notice{background:#111!important;color:#fff!important;border:0!important}
*{color:inherit}
.retour{display:block;font-size:14px;margin:14px 20px 0;color:#111!important;text-decoration:underline}</style></head><body><a class="retour" href="index.html#evaluations">Évaluations</a><div class="sheet"><header><div class="haut"><div><div class="nom" id="name">Chargement de votre fiche…</div><div class="sous" id="period"></div></div><div class="etape-info" id="stepinfo"></div></div><nav class="onglets" id="tabs" aria-label="Progression"></nav></header><main><div id="notice" class="notice" hidden></div><div id="pages"></div><p id="error" class="error" role="alert" hidden></p><div class="actions" id="actions" hidden><button type="button" class="secondary" id="back">Retour</button><button type="button" class="secondary" id="save">Enregistrer mon brouillon</button><button type="button" class="primary" id="next">Continuer</button></div><p class="status" id="status" aria-live="polite"></p></main><footer>Votre fiche personnelle · Les deux rencontres conservent leurs propres réponses.</footer></div>
<script>
const init={demo:true};
let data=null,page=0,busy=false,values={};const TAB_NAMES=['Compétences','Valeurs','Développement','Rythme et charge','Priorités','Commentaires','Mon expérience','Préparer'];
const rhLevels=['Pas du tout d’accord','Peu d’accord','Moyennement d’accord','Plutôt d’accord','Tout à fait d’accord'];
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function ryNum(v){const n=Number(String(v).replace(/[^0-9,.-]/g,'').replace(',','.'));return isNaN(n)?null:n;}function rythmeTable(rows,per){const w=node('div',undefined,'ry');if(per)w.append(node('p',per,'ry-per'));w.append(node('p','À titre indicatif, pour la discussion lors de la rencontre.','ry-note'));const e=node('div',undefined,'e');['Indicateur','Réalisé','Cible','Réalisé vs cible'].forEach(t=>e.append(node('span',t)));w.append(e);rows.forEach(r=>{const l=node('div',undefined,'l');l.append(node('span',r.label));const v1=node('span',r.realise,'v');v1.dataset.l='Réalisé';const v2=node('span',r.cible,'v');v2.dataset.l='Cible';l.append(v1);l.append(v2);const c=ryNum(r.seuil),n=ryNum(r.realise);const col=node('div');if(c!==null&&n!==null){const M=r.auto?Math.max(c,n):Math.max(100,c,n);const b=node('div',undefined,'b');const i=document.createElement('i');i.style.width=Math.max(0,Math.min(100,n/M*100))+'%';const u=document.createElement('u');u.style.left=Math.max(0,Math.min(99,c/M*100))+'%';b.append(i,u);col.append(b);const ok=r.inverse?n<=c:n>=c;col.append(node('span',ok?'Dans la cible':(r.inverse?'Au-dessus de la cible':'Sous la cible'),'t'+(ok?' ok':'')));}l.append(col);w.append(l);});return w;}
function error(msg){document.getElementById('error').textContent=msg;document.getElementById('error').hidden=!msg;}
function demoData(){const texts=['Je suis très loin des attentes : Je rencontre des difficultés majeures et j’ai besoin d’un accompagnement constant.','Je suis nettement sous les attentes : Je rencontre des difficultés importantes et j’ai besoin d’aide très fréquemment.','Je suis sous les attentes : J’ai plusieurs éléments à améliorer et j’ai besoin d’aide régulièrement.','Je réponds partiellement aux attentes : Je maîtrise certains éléments, mais je dois encore apporter des corrections fréquentes.','Je me rapproche des attentes : J’ai acquis les bases, mais mes résultats manquent encore de constance.','Je réponds aux attentes essentielles : Mon travail répond aux exigences de base, mais je dois encore faire certains ajustements.','Je réponds aux attentes : Mon travail est fiable et conforme aux exigences de mon poste.','Je dépasse souvent les attentes : Je dépasse régulièrement les exigences de mon poste.','Je dépasse largement les attentes : Mes résultats sont supérieurs et constants, et je peux servir de référence à mes collègues.','Je fais preuve d’une maîtrise exemplaire : Je maîtrise pleinement et durablement mon travail, et je peux guider ou former les autres.'];const fields=[];const add=(cell,label,kind,max,scale,required)=>fields.push({cell,label,kind,max,scale,required,value:''});['Connaissances et compétences techniques','Autonomie et résolution de problèmes','Qualité et constance du travail'].forEach((s,i)=>{add('C'+(21+i),s,'score',10,'competence',true);add('D'+(21+i),'Observations','text');});['Respect','Ouverture et innovation','Responsabilisation','Collaboration','Intégrité'].forEach((s,i)=>{add('C'+(28+i),s,'score',10,'competence',true);add('D'+(28+i),'Observations','text');});['Tâches acquises','Aspirations à 3–5 ans','Développement souhaité'].forEach((s,i)=>add('B'+(35+i),s,'text'));add('B42','Priorités retenues','text');add('B43','Soutien ou ressources','text');add('B44','Commentaires de l’employé','text');['Je comprends clairement ce qui est attendu de moi dans mon travail.','J’ai les outils et les informations nécessaires pour bien faire mon travail.','Lorsque j’en ai besoin, je peux obtenir de l’aide.','Ma charge de travail me permet de maintenir la qualité attendue.','Je sens que mon travail et mes efforts sont reconnus.','J’ai des occasions d’apprendre et de développer mes compétences au laboratoire.'].forEach((s,i)=>{add('C'+(59+i),s,'score',5,'experience',false);add('D'+(59+i),'Commentaire','text');});add('A68','De quelle réalisation ou de quel progrès suis-je le plus fier depuis notre dernière rencontre?','text');add('A70','Quel changement concret m’aiderait le plus à mieux travailler au quotidien?','text');return {name:'Marie Exemple',year:2027,meeting:2,done:false,rythme:[{label:'Heures travaillées par semaine',realise:'30,89',cible:'37,25',seuil:'37,25',auto:true},{label:'Charge effectuée',realise:'71',cible:'80 et +',seuil:'80'},{label:'Charge non terminée',realise:'3',cible:'5 et −',seuil:'5',inverse:true},{label:'Objectifs atteints',realise:'75',cible:'80 et +',seuil:'80'}],rythmePeriode:'Moyenne du 1er mai 2026 au 31 octobre 2026',fields,bareme:texts.map((s,i)=>(i+1)+' — '+s)};}
function sectionFor(f){const n=Number(f.cell.slice(1));if(f.cell==='A68'||f.cell==='A70')return 7;if(n>=59)return 6;if(f.cell==='B44')return 5;if(f.cell==='B42'||f.cell==='B43')return 4;return n>=35?2:n>=28?1:0;}
function build(d){data=d;document.getElementById('name').textContent=d.name;document.getElementById('period').textContent='Autoévaluation · Rencontre '+d.meeting+' · '+d.year+' · Lafond Desjardins';const pages=document.getElementById('pages');pages.replaceChildren();values=Object.fromEntries(d.fields.map(f=>[f.cell,f.value]));const names=['Évaluation des compétences','Valeurs humaines','Connaissances et développement — Plan de développement','Rythme et charge de travail','Priorités et engagements','Commentaires de l’employé','Mon expérience au laboratoire','Pour préparer notre rencontre'];for(let i=0;i<8;i++){const s=node('section');s.dataset.page=i;s.append(node('div',names[i]+' · '+(i+1)+' sur 8','step'));s.append(node('h2',names[i]));if(i===3&&!(d.rythme&&d.rythme.length))s.append(node('p','Heures travaillées par semaine, charge effectuée, charge non terminée et objectifs atteints : ces points seront examinés dans cet ordre avec votre responsable pendant la rencontre.'));if(i===0||i===1||i===6){const details=node('details');details.append(node('summary','Voir le barème complet'));const list=node('ul',undefined,'scale');(i===6?rhLevels.map((t,k)=>(k+1)+' — '+t).concat('Non applicable'):d.bareme).forEach(t=>list.append(node('li',t)));details.append(list);s.append(details);}if(i===3&&d.rythme&&d.rythme.length)s.append(rythmeTable(d.rythme,d.rythmePeriode));pages.append(s);}
for(const f of d.fields){const section=pages.querySelector('[data-page="'+sectionFor(f)+'"]');if(f.kind==='score'){const q=node('div',undefined,'question');q.append(node('span',f.label,'qtitle'));const ratings=node('div',undefined,'ratings'+(f.max===5?' five':''));ratings.setAttribute('role','group');ratings.setAttribute('aria-label',f.label);const text=node('div',undefined,'rating-text');text.setAttribute('aria-live','polite');const buttons=[];function paint(){buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(Number(values[f.cell])===i+1)));text.textContent=values[f.cell]===''?'Choisissez une note.':values[f.cell]==='Non applicable'?'Non applicable':f.scale==='experience'?rhLevels[Number(values[f.cell])-1]:d.bareme[Number(values[f.cell])-1];}
for(let n=1;n<=f.max;n++){const b=node('button',String(n));b.type='button';b.disabled=d.done;b.setAttribute('aria-label',n+' sur '+f.max);b.onclick=()=>{values[f.cell]=n;paint();markChanged();};buttons.push(b);ratings.append(b);}q.append(ratings,text);if(f.scale==='experience'){const na=node('button','Non applicable','na');na.type='button';na.disabled=d.done;na.onclick=()=>{values[f.cell]='Non applicable';paint();na.setAttribute('aria-pressed','true');markChanged();};ratings.addEventListener('click',()=>na.setAttribute('aria-pressed','false'));q.append(na);}paint();section.append(q);}else{const obs=/^D/.test(f.cell),q=node('div',undefined,obs?'obs':'question'),label=node('label',f.label,obs?'optional':'qtitle');label.htmlFor='field-'+f.cell;const input=node('textarea');input.id=label.htmlFor;input.maxLength=5000;input.value=String(f.value||'');input.disabled=d.done;input.oninput=()=>{values[f.cell]=input.value;markChanged();};q.append(label,input);section.append(q);}}
if(init.demo||d.done){const note=document.getElementById('notice');note.hidden=false;note.textContent=init.demo?'Mode essai : vos réponses ne sont pas enregistrées.':'Votre autoévaluation est terminée. Vous pouvez consulter vos réponses.';}
document.getElementById('actions').hidden=false;document.getElementById('save').hidden=d.done;show(0);}
function markChanged(){document.getElementById('status').textContent=init.demo?'Essai local : aucune réponse envoyée.':'Modifications à enregistrer.';}
function show(n){page=n;document.querySelectorAll('[data-page]').forEach(s=>s.hidden=Number(s.dataset.page)!==n);const tabs=document.getElementById('tabs');if(!tabs.children.length)TAB_NAMES.forEach((t,k)=>{const d=document.createElement('div');const ii=document.createElement('i');ii.textContent=String(k+1);d.append(ii,t);tabs.append(d);});Array.from(tabs.children).forEach((d,k)=>{d.classList.toggle('act',k===n);d.classList.toggle('fait',k<n);});const at=tabs.children[n];if(at&&at.scrollIntoView)at.scrollIntoView({block:'nearest',inline:'center'});document.getElementById('stepinfo').textContent='Étape '+(n+1)+' / 8';document.getElementById('back').hidden=n===0;document.getElementById('next').textContent=n===7?(data.done?'Autoévaluation terminée':'Terminer mon autoévaluation'):'Continuer';document.getElementById('next').disabled=data.done&&n===7;error('');}
function validate(section){for(const f of data.fields.filter(f=>f.required&&sectionFor(f)===section)){if(!Number.isInteger(Number(values[f.cell]))||Number(values[f.cell])<1||Number(values[f.cell])>f.max){error('Choisissez une note pour « '+f.label+' ».');return false;}}return true;}
function setBusy(b){busy=b;document.querySelectorAll('#actions button').forEach(x=>x.disabled=b);document.querySelectorAll('textarea,.ratings button,.na').forEach(x=>x.disabled=b||data.done);}
function save(finish,after){if(busy)return;error('');if(finish&&!data.fields.filter(f=>f.required).every(f=>Number.isInteger(Number(values[f.cell]))&&Number(values[f.cell])>=1&&Number(values[f.cell])<=f.max)){error('Complétez les notes de compétences et de valeurs humaines avant de terminer.');return;}if(init.demo){document.getElementById('status').textContent=finish?'Démonstration terminée : aucune réponse envoyée.':'Brouillon essayé : aucune réponse enregistrée.';if(finish)confirmDone(true);else if(after)after();return;}setBusy(true);document.getElementById('status').textContent='Enregistrement en cours…';google.script.run.withSuccessHandler(r=>{data.revision=r.revision;setBusy(false);document.getElementById('status').textContent='Réponses enregistrées.';if(r.done)confirmDone(false);else if(after)after();}).withFailureHandler(e=>{setBusy(false);document.getElementById('status').textContent='';error(e.message||'L’enregistrement a échoué. Vos réponses restent à l’écran; veuillez réessayer.');}).aeWebEnregistrer(init,{values,revision:data.revision,finish});}
function confirmDone(demo){document.getElementById('pages').replaceChildren();const box=node('div',undefined,'done');box.append(node('div','✓','mark'),node('h2','Merci pour votre autoévaluation.'),node('p',demo?'Cet essai ne modifie aucun document.':'Vos réponses sont enregistrées pour cette rencontre. Elles prépareront notre discussion.'));document.getElementById('pages').append(box);document.getElementById('actions').hidden=true;}
document.getElementById('back').onclick=()=>show(page-1);document.getElementById('save').onclick=()=>save(false);document.getElementById('next').onclick=()=>{if(data.done){if(page<7)show(page+1);return;}if(page<7){if(validate(page))save(false,()=>show(page+1));}else save(true);};
if(init.demo)build(demoData());else google.script.run.withSuccessHandler(build).withFailureHandler(e=>error(e.message)).aeWebLire(init);
window.addEventListener('beforeunload',e=>{if(document.getElementById('status').textContent==='Modifications à enregistrer.'){e.preventDefault();e.returnValue='';}});
</script></body></html>
